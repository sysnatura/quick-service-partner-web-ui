<div class="main animate-slide-left" ng-hide="vm.chatActive">
    <md-list class="recent">
        <md-subheader class="md-no-sticky">
            <span translate="QUICKPANEL.RECENT">Recent</span>
        </md-subheader>

        <md-list-item class="contact md-3-line" ng-repeat="user in vm.filteredUsers |orderBy:'lastUpdatedDate':true"
                      ng-click="vm.getChat(user.userId)" ng-if="user.recent==true">
            <img ng-if="user.profilePic==null" ng-src="assets/images/avatars/profile.jpg" class="md-avatar" alt="{{user.name}}" />
            <img ng-if="user.profilePic!=null" ng-src="/ProfilePic/{{user.profilePic}}" class="md-avatar" alt="{{user.name}}" />

            <div class="status  {{user.status}}"></div>

            <div ng-if="vm.privateChatSessions.getById(user.userId).unread" class="md-accent-bg unread-message-count">{{vm.privateChatSessions.getById(user.userId).unread}}</div>

            <div class="md-list-item-text">
                <h3>{{user.name}}</h3>
                <p class="last-message">{{vm.privateChatSessions.getById(user.userId).lastMessage}}</p>
            </div>
        </md-list-item>
    </md-list>

    <md-divider></md-divider>

    <md-list class="all">
        <md-subheader class="md-no-sticky">
            <span translate="QUICKPANEL.START_NEW_CHAT">Start New Chat</span>
        </md-subheader>

        <md-list-item class="contact" ng-repeat="user in vm.filteredUsers" ng-click="vm.getChat(user.userId)" ng-if="user.recent==false">
            <img ng-if="user.profilePic==null" ng-src="assets/images/avatars/profile.jpg" class="md-avatar" alt="{{user.name}}" />
            <img ng-if="user.profilePic!=null" ng-src="/ProfilePic/{{user.profilePic}}" class="md-avatar" alt="{{user.name}}" />

            <div class="status {{user.status}}"></div>

            <div class="md-list-item-text">
                <h3>{{user.name}}</h3>
            </div>
        </md-list-item>
    </md-list>

    <md-divider></md-divider>
</div>

<div class="chat animate-slide-right" ng-show="vm.chatActive" layout="column">
    <md-toolbar class="md-accent">
        <div class="md-toolbar-tools" layout="row" layout-align="space-between center">

            <div layout="row" layout-align="start center">
                <md-button class="md-icon-button" ng-click="vm.chatActive = !vm.chatActive" aria-label="Back" translate
                           translate-attr-aria-label="QUICKPANEL.BACK">
                    <md-icon md-font-icon="icon-keyboard-backspace"></md-icon>
                </md-button>
                <h4>
                    <span>{{vm.users.getById(vm.receiverId).name}}</span>
                </h4>
            </div>

            <div layout="row" layout-align="end center">
                <md-button class="md-icon-button" aria-label="Call" translate
                           translate-attr-aria-label="QUICKPANEL.CALL">
                    <md-icon md-font-icon="icon-phone"></md-icon>
                </md-button>

                <md-button class="md-icon-button" aria-label="More" translate
                           translate-attr-aria-label="QUICKPANEL.MORE">
                    <md-icon md-font-icon="icon-dots-vertical"></md-icon>
                </md-button>
            </div>
        </div>

    </md-toolbar>
    <md-content flex layout-paddings ms-scroll id="chat-dialog">
        <div layout="row" ng-repeat="privateChat in vm.privateChatMessages" class="md-padding message-row"
             ng-class="privateChat.dialog.who">
            <img ng-if="privateChat.dialog.who ==='contact'" class="avatar"
                 ng-src="{{vm.users.getById(privateChat.receiverId).profilePic == null ? 'assets/images/avatars/profile.jpg' : vm.users.getById(privateChat.receiverId).profilePic}}"
                 alt="{{vm.users.getById(privateChat.receiverId).firstName}}" />
            <img ng-if="privateChat.dialog.who ==='user'" class="avatar" 
                 ng-src="{{vm.users.getById(privateChat.senderId).profilePic == null ? 'assets/images/avatars/profile.jpg' : vm.users.getById(privateChat.senderId).profilePic}}"
                 alt="{{vm.users.getById(privateChat.senderId).firstName}}" />
            <div class="bubble" flex>
                <div class="message">{{privateChat.dialog.message}}</div>
                <div class="time secondary-text">{{privateChat.dialog.time| altDate}}</div><!--| altDate-->
            </div>
        </div>
    </md-content>

    <form ng-submit="vm.reply()" layout="row" class="reply" layout-align="start center">
        <textarea ng-keyup="$event.keyCode == 13 ? vm.reply() : null" flex
                  ng-model="vm.replyMessage" placeholder="Type and hit enter to send message" translate
                  translate-attr-placeholder="QUICKPANEL.REPLY_PLACEHOLDER"></textarea>

        <md-button class="md-fab md-mini" type="submit" aria-label="Send message" translate
                   translate-attr-aria-label="QUICKPANEL.SEND_MESSAGE">
            <md-icon md-font-icon="icon-send"></md-icon>
        </md-button>
    </form>
</div>

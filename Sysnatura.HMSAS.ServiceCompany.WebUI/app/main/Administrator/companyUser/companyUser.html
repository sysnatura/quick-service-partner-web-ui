<div id="contacts" class="page-layout simple left-sidenav inner-sidenav" ng-init="vm.getAllCompanyUser()">
<!--<div id="contacts" class="page-layout simple left-sidenav inner-sidenav"  >-->

    <!--<div id="contacts" class="page-layout simple left-sidenav inner-sidenav" >-->
    <!-- HEADER -->
    <div class="header md-accent-bg" layout="row" layout-align="space-between center">

        <!-- APP TITLE -->
        <div layout="row" layout-align="start center">
            <md-button class="md-icon-button sidenav-toggle" hide-gt-md ng-click="vm.toggleSidenav('sidenav')"
                       aria-label="Toggle sidenav" translate-attr-aria-label="LANGUAGE.TOGGLE_SIDENAV">
                <md-icon md-font-icon="icon-menu" class="icon"></md-icon>
            </md-button>

            <div class="logo" layout="row" layout-align="start center">
                <span class="logo-icon">
                    <md-icon md-font-icon="icon-worker" class="s24"></md-icon>
                </span>
                <span class="logo-text" >User</span>
            </div>
        </div>
        <!-- / APP TITLE -->
        <!-- SEARCH -->
        <div class="search-input-wrapper" layout="row" layout-align="start center">
            <label for="search">
                <md-icon md-font-icon="icon-magnify"></md-icon>
            </label>
            <md-input-container md-no-float class="m-0">
                <input id="search" placeholder="Search for User" type="text" ng-model="vm.search" >
            </md-input-container>
        </div>
        <!-- / SEARCH -->

    </div>
    <!-- / HEADER -->
    <!-- SELECTED BAR -->
    <div ng-show="vm.selectedSkills.length > 0" class="selected-bar header animate-slide-down md-accent-bg"
         layout="row" layout-align="start center">

        <div class="close-button-wrapper" ng-click="vm.selectedSkills =[]">
            <md-button layout="row" layout-align="start center">
                <md-icon md-font-icon="icon-arrow-left" class="mr-8"></md-icon>
                <span>Back</span>
            </md-button>
        </div>

        <div flex layout="row" layout-align="space-between center">

            <div>
                <span class="selected-contacts-count">
                    <span>{{vm.selectedSkills.length}}</span>
                    <span>selected</span>
                </span>

                <md-menu class="select-menu" ng-if="!vm.currentThread">
                    <md-button class="md-icon-button"
                               ng-click="$mdOpenMenu($event)"
                               aria-label="multi select toggle">
                        <md-icon md-font-icon="icon-menu-down"></md-icon>
                    </md-button>
                    <md-menu-content width="3">
                        <md-menu-item>
                            <md-button ng-click="vm.selectAllSkills()">
                                Select all
                            </md-button>
                        </md-menu-item>
                        <md-menu-item>
                            <md-button ng-click="vm.deselectSkills()">
                                Select none
                            </md-button>
                        </md-menu-item>
                    </md-menu-content>
                </md-menu>
            </div>

            <div class="multi-select-actions">
                <md-button class="md-icon-button" ng-click="vm.deleteSelectedSkills($event)"
                           aria-label="delete selected">
                    <md-icon md-font-icon="icon-delete"></md-icon>
                </md-button>
            </div>

        </div>

    </div>
    <!-- / SELECTED BAR -->
    <!-- CONTENT -->
    <div class="content fullpage-datatable scrollable" ms-scroll>
        <div class="white-bg md-whiteframe-4dp">
            <table class="dataTable row-border hover" datatable="ng" dt-options="vm.dtOptions">
                <thead>
                    <tr>
                        <!--<th class="secondary-text">

                        </th>-->
                        <th class="secondary-text">
                            <div class="table-header">
                                <span class="column-title">Name</span>
                            </div>
                        </th>
                        <th class="secondary-text">
                            <div class="table-header">
                                <span class="column-title">User Name</span>
                            </div>
                        </th>
                        <th class="secondary-text">
                            <div class="table-header">
                                <span class="column-title">Status</span>
                            </div>
                        </th>
                        <th class="secondary-text">
                            <span class="column-title">Options</span>
                        </th>

                    </tr>
                </thead>

                <tbody>
                    <tr ng-repeat="companyUser in vm.companyUser | filter: vm.search">
                        <td class="name">{{companyUser.name}}</td>
                        <td class="name">{{companyUser.username}}</td>
                        <td>
                            <span class="ml-16 text-boxed green-bg white-fg ng-binding" ng-if="companyUser.recordStatus === 0 ">ACTIVE</span>
                            <span class="ml-16 text-boxed red-bg white-fg ng-binding" ng-if="companyUser.recordStatus ===1 ">INACTIVE</span>
                        </td>
                       <td>
                           <md-button class="edit-button md-icon-button" aria-label="Go to language"
                                      ng-click="vm.openCompanyUserDialog($event,companyUser)">
                               <md-tooltip> <span>Edit</span></md-tooltip>
                               <md-icon md-font-icon="icon-pencil" class="s16"></md-icon>
                           </md-button>
                           <md-button class="md-icon-button" ng-click="confirm($event,companyUser.companyUsersId)"
                                      aria-label="delete selected">
                               <md-tooltip> <span>Delete</span> </md-tooltip>
                               <md-icon md-font-icon="icon-delete"></md-icon>
                           </md-button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <!-- NO RESULTS -->
        <md-list-item class="no-results md-white-bg" ng-show="filteredLanguage.length === 0">
            <p>No results..</p>
        </md-list-item>
        <!-- / NO RESULTS -->
        <!-- / MAIN -->

    </div>
    <!-- / CONTENT -->
    <!-- ADD CONTACT BUTTON -->
    <md-button class="md-fab md-accent md-icon-button" id="add-contact-button" ng-click="vm.openCompanyUserDialog($event)"
               aria-label="add LANGUAGE">
        <md-tooltip> <span>Add Company User</span> </md-tooltip>
        <md-icon md-font-icon="icon-playlist-plus"></md-icon>
    </md-button>
    <!-- / ADD CONTACT BUTTON -->
</div>
